name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        if: github.server_url == 'https://github.com'
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install pip --upgrade
          if grep version pyproject.toml | grep -q "dev";
            then pip install https://github.com/fiduswriter/fiduswriter/archive/develop.zip;
            else pip install https://github.com/fiduswriter/fiduswriter/archive/main.zip;
          fi
      - uses: pre-commit/action@v3.0.1
  test:
    runs-on: ubuntu-latest
    env:
      LANGUAGETOOL_VERSION: 6.5
    steps:
    - name: Install Chrome (Forgejo runners)
      if: github.server_url != 'https://github.com'
      run: |
          apt-get update
          apt-get install -y wget gnupg ca-certificates
          wget -q -O /tmp/google-chrome.gpg https://dl.google.com/linux/linux_signing_key.pub
          gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
          apt-get update
          apt-get install -y google-chrome-stable
    - name: Set up Python
      uses: actions/setup-python@v6
      if: github.server_url == 'https://github.com'
      with:
        python-version: "3.14"
    - uses: actions/checkout@v4
    - uses: nanasess/setup-chromedriver@master
    - name: Install dependencies
      run: |
        SUDO=""
        if [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
        $SUDO apt-get update
        $SUDO apt-get install -y libjpeg-dev python3-dev python3-pip gettext zlib1g-dev git nodejs build-essential openjdk-11-jre
        wget https://languagetool.org/download/LanguageTool-${LANGUAGETOOL_VERSION}.zip
        unzip LanguageTool-${LANGUAGETOOL_VERSION}.zip
        if grep version pyproject.toml | grep -q "dev";
          then pip install https://github.com/fiduswriter/fiduswriter/archive/develop.zip;
          else pip install https://github.com/fiduswriter/fiduswriter/archive/main.zip;
        fi
        pip install requests[security]
        pip install coverage
        pip install coveralls
        pip install packaging
        pip install webdriver-manager
        pip install selenium
        pip install wheel
        pip install pip --upgrade
        cd fiduswriter
        mv ../ci/configuration.py ./
        mv ../ci/.coveragerc ./
        coverage run $(which fiduswriter) setup --no-static
    - name: Run test languagetool
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 8
        max_attempts: 3
        retry_on: error
        command: |
          cd LanguageTool-${LANGUAGETOOL_VERSION}
          java -cp languagetool-server.jar org.languagetool.server.HTTPServer --port 9000 &
          cd ../fiduswriter
          coverage run $(which fiduswriter) test languagetool
    - name: Coveralls
      if: github.server_url == 'https://github.com'
      run: |
          cd fiduswriter
          coverage combine
          coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
